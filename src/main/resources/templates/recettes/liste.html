<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recettes</title>
</head>
<body>
<h1>Recettes</h1>

<a th:href="@{/recettes/ajouter}">+ Ajouter une recette</a> |
<a th:href="@{/ingredients}">Aller au catalogue des ingrédients</a>

<table border="1">
    <thead>
    <tr>
        <th>Titre</th>
        <th>Description</th>
        <th>Difficulté</th>
        <th>Personnes</th>
        <th>Temps (min)</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${recettes}">
        <td th:text="${r.titre}"></td>
        <td th:text="${r.description}"></td>
        <td th:text="${r.difficulte}"></td>
        <td th:text="${r.nbPersonnes}"></td>
        <td th:text="${r.temps}"></td>
        <td>
            <a th:href="@{/recettes/modifier/{id}(id=${r.id})}">Modifier</a>
            <form th:action="@{/recettes/supprimer/{id}(id=${r.id})}" method="post" style="display:inline">
                <button type="submit">Supprimer</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(recettes)}">
        <td colspan="6">Aucune recette.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
