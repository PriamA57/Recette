<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recette</title>
</head>
<body>
<h1>Recette</h1>

<form th:action="@{/recettes/enregistrer}" th:object="${recette}" method="post">
    <input type="hidden" th:field="*{id}"/>

    <p>
        <label>Titre :</label><br>
        <input type="text" th:field="*{titre}" required/>
    </p>
    <p>
        <label>Description :</label><br>
        <textarea th:field="*{description}" rows="4" cols="40"></textarea>
    </p>
    <p>
        <label>Difficulté :</label><br>
        <select th:field="*{difficulte}">
            <option value="Facile">Facile</option>
            <option value="Moyen">Moyen</option>
            <option value="Difficile">Difficile</option>
        </select>
    </p>
    <p>
        <label>Nombre de personnes :</label><br>
        <input type="number" th:field="*{nbPersonnes}" min="1"/>
    </p>
    <p>
        <label>Temps (minutes) :</label><br>
        <input type="number" th:field="*{temps}" min="0"/>
    </p>

    <button type="submit">Enregistrer</button>
    <a th:href="@{/recettes}">Annuler</a>
</form>
</body>
</html>
