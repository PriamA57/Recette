<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle recettes</title>
</head>
<body>
<h1>Nouvelle recettes</h1>
<form th:action="@{/recettes}" th:object="${recette}" method="post">
    <p>Titre : <input type="text" th:field="*{titre}"></p>
    <p>Description : <input type="text" th:field="*{description}" required></p>
    <p>Temps : <input type="text" th:field="*{temps}"></p>
    <p>Difficulté : <input type="text" th:field="*{difficulte}"></p>
    <p>Pour combien de personne : <select>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
    </select>
    <button type="submit">Enregistrer</button>
    <a th:href="@{/recettes}">Annuler</a>
</form>
</body>
</html>
